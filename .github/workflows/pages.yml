name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site (Actions source) when it does not exist yet.
          # Requires a token that can administer the repository; the default
          # GITHUB_TOKEN is tried first.
          enablement: true

      - name: Expand splat symlinks
        run: |
          # Pages artifacts cannot contain symlinks. Expand aliases in the
          # runner workspace only; git still stores them as links.
          cd assets/splats
          for f in mountain.sog coast.sog ocean-waterfall.sog; do
            if [ -L "$f" ]; then
              target=$(readlink "$f")
              rm "$f"
              cp -a "$target" "$f"
            fi
          done
          if find . -type l | grep -q .; then
            echo "symlinks remain in splat assets" >&2
            find . -type l
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
