name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download Big Sur coast splat
        run: |
          set -euo pipefail
          mkdir -p assets/splats
          # Unlicensed waterfall placeholder must not ship, even as a symlink.
          rm -f assets/splats/waterfall.sog \
                assets/splats/mountain.sog \
                assets/splats/ocean-waterfall.sog \
                assets/splats/coast.sog
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            -o assets/splats/coast.sog \
            "https://huggingface.co/datasets/Jamesbass/bigsur-360-colmap/resolve/main/bigsur_v2_full_quality.sog"
          size=$(stat -c%s assets/splats/coast.sog)
          echo "coast.sog bytes: ${size}"
          if [ "${size}" -lt 100000000 ]; then
            echo "coast.sog looks truncated or is not the full-quality splat" >&2
            exit 1
          fi
          if [ -e assets/splats/waterfall.sog ]; then
            echo "refusing to publish waterfall.sog" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
