<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="云逸 — Big Sur 海岸。先看静帧，再进入可拖动的 Gaussian Splat。" />
  <title>云逸 · 海岸</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="../assets/coast-still.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4f0e8;
      --ink-dim: rgba(244, 240, 232, 0.72);
      --ink-mute: rgba(244, 240, 232, 0.48);
      --serif: "Noto Serif SC", "Cormorant Garamond", serif;
      --sans: "Noto Sans SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #8ea0ad;
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      overflow: hidden;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #c {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: #8ea0ad;
    }
    #still {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 3;
      pointer-events: none;
      opacity: 1;
      transition: opacity 1.15s ease;
    }
    #app.is-live #still { opacity: 0; }
    .vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 4;
      background:
        linear-gradient(180deg, rgba(10, 14, 18, 0.28) 0%, transparent 24%, transparent 62%, rgba(10, 14, 18, 0.45) 100%);
    }
    header.hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      padding: max(1.15rem, env(safe-area-inset-top)) 1.5rem 0;
      pointer-events: none;
    }
    .logo {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
      color: var(--ink);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35);
    }
    .logo-mark {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.9;
    }
    .logo-text {
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: 0.32em;
      font-weight: 500;
    }
    .hero-copy {
      position: absolute;
      left: 1.5rem;
      bottom: calc(6.4rem + env(safe-area-inset-bottom));
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.4);
    }
    .kicker {
      font-size: 0.66rem;
      letter-spacing: 0.38em;
      color: var(--ink-dim);
      margin-bottom: 0.45rem;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0.18em;
      margin: 0;
    }
    .brand {
      margin: 0.45rem 0 0;
      font-family: var(--serif);
      font-size: 1rem;
      letter-spacing: 0.42em;
      color: var(--ink-dim);
    }
    .credit {
      margin: 1.15rem 0 0;
      max-width: 18rem;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      line-height: 1.5;
      color: var(--ink-mute);
      pointer-events: auto;
    }
    .credit a {
      color: inherit;
      text-decoration: none;
    }
    .credit a:hover { color: var(--ink); }
    .scroll-hint {
      position: absolute;
      bottom: calc(1.35rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      color: var(--ink-mute);
      pointer-events: none;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #app.is-live .scroll-hint { opacity: 1; }
    #status {
      position: absolute;
      left: 1.5rem;
      right: 1.5rem;
      bottom: calc(3.4rem + env(safe-area-inset-bottom));
      z-index: 6;
      pointer-events: none;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--ink);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
    }
    #app.is-live #status {
      opacity: 0;
    }
    .bar {
      margin-top: 0.55rem;
      width: 7.5rem;
      height: 1px;
      background: rgba(244, 240, 232, 0.28);
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 100%;
      background: rgba(244, 240, 232, 0.9);
      transform: scaleX(0);
      transform-origin: left center;
    }
    #app.is-fallback .bar,
    #app.is-live .bar { display: none; }
    @media (max-width: 720px) {
      .hero-copy { left: 1.1rem; bottom: calc(5.6rem + env(safe-area-inset-bottom)); }
      #status { left: 1.1rem; }
      .scroll-hint { letter-spacing: 0.18em; }
    }
    @media (prefers-reduced-motion: reduce) {
      #still, .scroll-hint { transition: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>
    <img id="still" src="../assets/coast-still.jpg" width="1920" height="1080" alt="Big Sur 海岸悬崖" />
    <div class="vignette" aria-hidden="true"></div>

    <header class="hud-top">
      <a class="logo" href="../" aria-label="云逸">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">云逸</span>
      </a>
    </header>

    <div class="hero-copy">
      <div class="kicker">BIG SUR</div>
      <h1>海岸</h1>
      <p class="brand">云逸</p>
      <footer class="credit">
        <a href="https://huggingface.co/datasets/Jamesbass/bigsur-360-colmap" target="_blank" rel="noopener noreferrer">Jamesbass · bigsur-360-colmap</a>
        ·
        <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>
      </footer>
    </div>

    <div id="status" role="status" aria-live="polite">
      <span id="status-line">光景载入中</span>
      <div class="bar" aria-hidden="true"><span id="bar-fill"></span></div>
    </div>

    <div class="scroll-hint">SCROLL / 拖动探索</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
